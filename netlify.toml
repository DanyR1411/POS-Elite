[build]
  # No hay comando de compilación porque es HTML/CSS/JS puro
  command = ""
  # La carpeta raíz es la que Netlify publicará
  publish = "."

[[redirects]]
  # Redirige cualquier ruta a index.html (necesario para SPA)
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "18"
